name: Novel toolkit checks
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python tests (synthetic, zero external dependencies)
        run: python -m unittest discover -s tests -v
      - name: Check CLI usage
        run: |
          python tools/manuscript_pipeline.py --help
          python tools/manuscript_pipeline.py epub --help
      - name: End-to-end EPUB smoke with synthetic manuscript
        run: |
          python tools/manuscript_pipeline.py init /tmp/demo-novel --chapters 3 --title "Histoire fictive"
          python tools/manuscript_pipeline.py epub /tmp/demo-novel --author "Auteur fictif"
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/demo-novel/manuscript.epub'); assert z.read('mimetype') == b'application/epub+zip'; assert z.testzip() is None"
